<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Chat Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <h1>실시간 전체 채팅</h1>

    <!-- 로그인 폼 -->
    <div id="login-form">
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">로그인</button>
    </div>

    <br>

    <!-- 채팅창 -->
    <textarea id="chat-area" cols="100" rows="20" readonly></textarea><br>
    <input type="text" id="message-input" placeholder="메시지 입력">
    <button onclick="sendMessage()">전송</button>

    <script>
        var socket = io('http://localhost:5000');
        var token = '';

        // 서버 연결
        socket.on('connect', function() {
            console.log('Connected to server');

            // 기존 대화 불러오기
            fetch('http://localhost:5000/global_chats')
                .then(response => response.json())
                .then(messages => {
                    var chatArea = document.getElementById('chat-area');
                    chatArea.value = '';
                    messages.forEach(function(msg) {
                        chatArea.value += msg.username + ": " + msg.message + "\n";
                    });
                });
        });

        // 서버로부터 메시지 받으면 출력
        socket.on('receive_message', function(data) {
            var chatArea = document.getElementById('chat-area');
            chatArea.value += data.username + ": " + data.message + "\n";
        });

        // 로그인
        function login() {
            var username = document.getElementById('login-username').value.trim();
            var password = document.getElementById('login-password').value.trim();
            if (username === '' || password === '') {
                alert('Username과 Password를 입력하세요.');
                return;
            }

            fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.access_token) {
                    token = data.access_token;
                    alert('로그인 성공! 이제 채팅할 수 있어요.');
                } else {
                    alert('로그인 실패: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error during login:', error);
                alert('로그인 중 오류 발생');
            });
        }

        // 메시지 전송
        function sendMessage() {
            var messageInput = document.getElementById('message-input');
            var message = messageInput.value.trim();
            if (message === '') return;
            if (token === '') {
                alert('로그인 먼저 하세요!');
                return;
            }

            socket.emit('send_message', {
                token: token,
                message: message
            });

            messageInput.value = '';
        }
    </script>
</body>
</html>
